name: Check site
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 1"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
        working-directory: site
      - run: pnpm audit --audit-level low
        working-directory: site
      - run: pnpm test
        working-directory: site
      - run: node --test cms/tests/*.test.mjs
      - run: pnpm build
        working-directory: site
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          PUBLIC_SITE_INDEXABLE: 'true'

  extensions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        extension: [diarwiki-workflow, diarwiki-media]
    defaults:
      run:
        working-directory: cms/extensions/${{ matrix.extension }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
