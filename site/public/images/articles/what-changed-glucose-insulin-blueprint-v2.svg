<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Как меняется использование глюкозы при сахарном диабете 1 типа</title>
  <desc id="desc">Слева показана глюкоза, остающаяся в крови при нехватке инсулина. Справа введённый инсулин подаёт клетке сигнал использовать глюкозу.</desc>
  <rect width="900" height="520" fill="#073b8c"/>
  <text x="48" y="58" fill="#fff" font-family="Golos Text, Arial, sans-serif" font-size="30" font-weight="700">Глюкоза, инсулин и клетка</text>
  <text x="48" y="90" fill="#cbdcff" font-family="Golos Text, Arial, sans-serif" font-size="17">Упрощённая схема принципа — не схема лечения</text>

  <g transform="translate(48 122)">
    <rect width="388" height="330" rx="20" fill="#0b4aa8" stroke="#7da8ff"/>
    <text x="24" y="42" fill="#fff" font-family="Golos Text, Arial, sans-serif" font-size="22" font-weight="700">Инсулина не хватает</text>
    <text x="24" y="70" fill="#cbdcff" font-family="Golos Text, Arial, sans-serif" font-size="15">Глюкоза накапливается в крови</text>
    <rect x="24" y="100" width="340" height="64" rx="32" fill="#082f70" stroke="#7da8ff"/>
    <text x="38" y="136" fill="#cbdcff" font-family="Golos Text, Arial, sans-serif" font-size="14">КРОВЬ</text>
    <g fill="#ffb15a"><circle cx="132" cy="132" r="10"/><circle cx="176" cy="125" r="10"/><circle cx="221" cy="139" r="10"/><circle cx="266" cy="124" r="10"/><circle cx="309" cy="139" r="10"/></g>
    <path d="M194 195c66 0 120 30 120 68s-54 68-120 68S74 301 74 263s54-68 120-68Z" fill="#eef4ff" stroke="#fff" stroke-width="2"/>
    <text x="159" y="270" fill="#073b8c" font-family="Golos Text, Arial, sans-serif" font-size="18" font-weight="700">КЛЕТКА</text>
    <line x1="194" y1="165" x2="194" y2="188" stroke="#ff7a1a" stroke-width="4" stroke-linecap="round"/>
    <line x1="181" y1="178" x2="207" y2="178" stroke="#ff7a1a" stroke-width="4" stroke-linecap="round"/>
    <text x="222" y="190" fill="#ffd0a6" font-family="Golos Text, Arial, sans-serif" font-size="14">нет сигнала</text>
  </g>

  <g transform="translate(464 122)">
    <rect width="388" height="330" rx="20" fill="#0b4aa8" stroke="#7da8ff"/>
    <text x="24" y="42" fill="#fff" font-family="Golos Text, Arial, sans-serif" font-size="22" font-weight="700">Инсулин введён</text>
    <text x="24" y="70" fill="#cbdcff" font-family="Golos Text, Arial, sans-serif" font-size="15">Клетка получает сигнал использовать глюкозу</text>
    <rect x="24" y="100" width="340" height="64" rx="32" fill="#082f70" stroke="#7da8ff"/>
    <text x="38" y="136" fill="#cbdcff" font-family="Golos Text, Arial, sans-serif" font-size="14">КРОВЬ</text>
    <g fill="#ffb15a"><circle cx="160" cy="130" r="10"/><circle cx="210" cy="136" r="10"/><circle cx="260" cy="127" r="10"/></g>
    <path d="M194 195c66 0 120 30 120 68s-54 68-120 68S74 301 74 263s54-68 120-68Z" fill="#eef4ff" stroke="#fff" stroke-width="2"/>
    <text x="159" y="270" fill="#073b8c" font-family="Golos Text, Arial, sans-serif" font-size="18" font-weight="700">КЛЕТКА</text>
    <rect x="181" y="186" width="26" height="12" rx="6" fill="#ff7a1a"/>
    <path d="M194 198v40" stroke="#ff7a1a" stroke-width="4" stroke-linecap="round" stroke-dasharray="5 7"/>
    <path d="m186 232 8 10 8-10" fill="none" stroke="#ff7a1a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="224" y="192" fill="#ffd0a6" font-family="Golos Text, Arial, sans-serif" font-size="14">сигнал инсулина</text>
    <circle cx="241" cy="244" r="10" fill="#ffb15a"/>
    <circle cx="267" cy="277" r="10" fill="#ffb15a"/>
  </g>

  <g transform="translate(48 478)">
    <circle cx="8" cy="-5" r="8" fill="#ffb15a"/>
    <text x="24" y="0" fill="#fff" font-family="Golos Text, Arial, sans-serif" font-size="14">глюкоза</text>
    <rect x="130" y="-11" width="20" height="12" rx="6" fill="#ff7a1a"/>
    <text x="160" y="0" fill="#fff" font-family="Golos Text, Arial, sans-serif" font-size="14">сигнал инсулина</text>
  </g>
</svg>
