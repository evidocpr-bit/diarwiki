<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Базальная и прандиальная роль инсулина</title>
  <desc id="desc">Базальный инсулин показан непрерывной фоновой линией суток, прандиальный — отдельными отметками рядом с приёмами пищи. Справа перечислены пять признаков препарата.</desc>
  <rect width="900" height="520" fill="#073b8c"/>
  <text x="48" y="58" fill="#fff" font-family="Golos Text, Arial, sans-serif" font-size="30" font-weight="700">Две роли — пять признаков</text>
  <text x="48" y="90" fill="#cbdcff" font-family="Golos Text, Arial, sans-serif" font-size="17">Роль препарата важнее цвета ручки</text>
  <g transform="translate(48 126)" font-family="Golos Text, Arial, sans-serif">
    <rect width="500" height="310" rx="20" fill="#0b4aa8" stroke="#7da8ff"/>
    <text x="24" y="42" fill="#fff" font-size="21" font-weight="700">Условные сутки</text>
    <line x1="52" y1="258" x2="448" y2="258" stroke="#cbdcff" stroke-width="2"/>
    <g fill="#cbdcff" font-size="13" text-anchor="middle"><text x="52" y="282">00</text><text x="184" y="282">08</text><text x="316" y="282">16</text><text x="448" y="282">24</text></g>
    <rect x="52" y="206" width="396" height="22" rx="11" fill="#7da8ff"/>
    <text x="52" y="190" fill="#fff" font-size="16" font-weight="700">БАЗАЛЬНЫЙ — фон</text>
    <g fill="#ff7a1a">
      <path d="M148 206c12-74 30-74 42 0Z"/>
      <path d="M264 206c12-74 30-74 42 0Z"/>
      <path d="M376 206c12-74 30-74 42 0Z"/>
    </g>
    <g fill="#ffd0a6" font-size="13" text-anchor="middle"><text x="169" y="112">еда</text><text x="285" y="112">еда</text><text x="397" y="112">еда</text></g>
    <text x="52" y="82" fill="#fff" font-size="16" font-weight="700">ПРАНДИАЛЬНЫЙ — вокруг еды</text>
    <text x="24" y="302" fill="#cbdcff" font-size="13">Профили условны: конкретные время и дозы берут из назначения.</text>
  </g>
  <g transform="translate(580 126)" font-family="Golos Text, Arial, sans-serif">
    <rect width="272" height="310" rx="20" fill="#eef4ff"/>
    <text x="24" y="44" fill="#073b8c" font-size="20" font-weight="800">Проверить на коробке</text>
    <g fill="#073b8c" font-size="17" font-weight="700">
      <circle cx="32" cy="86" r="12" fill="#ff7a1a"/><text x="32" y="92" text-anchor="middle" fill="#fff" font-size="14">1</text><text x="56" y="92">Роль</text>
      <circle cx="32" cy="132" r="12" fill="#ff7a1a"/><text x="32" y="138" text-anchor="middle" fill="#fff" font-size="14">2</text><text x="56" y="138">МНН</text>
      <circle cx="32" cy="178" r="12" fill="#ff7a1a"/><text x="32" y="184" text-anchor="middle" fill="#fff" font-size="14">3</text><text x="56" y="184">Торговое название</text>
      <circle cx="32" cy="224" r="12" fill="#ff7a1a"/><text x="32" y="230" text-anchor="middle" fill="#fff" font-size="14">4</text><text x="56" y="230">Концентрация</text>
      <circle cx="32" cy="270" r="12" fill="#ff7a1a"/><text x="32" y="276" text-anchor="middle" fill="#fff" font-size="14">5</text><text x="56" y="276">Устройство</text>
    </g>
  </g>
</svg>
